  <style>
  

.main-nav {
  background:#fff;
  border-bottom:1px solid #e6eef8;
  position:sticky;
  top:0;
  z-index:100;
}
.nav-container {
  max-width:1120px;
  margin:0 auto;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.nav-logo {
  font-weight:700;
  font-size:18px;
  color:#1a73e8;
  text-decoration:none;
}
.nav-links {
  list-style:none;
  display:flex;
  gap:20px;
  margin:0;
  padding:0;
}
.nav-links a {
  text-decoration:none;
  color:#374151;
  font-size:15px;
  transition:color .2s ease;
}
.nav-links a:hover {
  color:#1a73e8;
}

    :root{
      --bg:#f8f9fa;
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#1a73e8;
      --gap:18px;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body{margin:0;background:var(--bg);color:#0f172a;}
    header{background:#e6eef8;border-bottom:1px solid #e6eef8;}

    .banner{
      width:100%;
      height:600px;
      background:#ddd url("main-banner.png") center/cover no-repeat;
    }
    .header-inner{display:flex;align-items:center;gap:16px;padding:20px;}
    .logo{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#1a73e8,#34a853);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px;}
    header h1{margin:0;font-size:20px;}
    header p{margin:0;color:var(--muted);font-size:13px;}

    main{max-width:1120px;margin:28px auto;padding:0 18px 60px;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--gap);}

    .card{
      background:var(--card);
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 6px 18px rgba(12,20,35,0.04);
      display:flex;
      flex-direction:column;
      gap:12px;
      text-decoration:none;
      color:inherit;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(12,20,35,0.06);}
    .header-img img{width:100%;height:160px;object-fit:cover;display:block;}
    .card-body{padding:14px;display:flex;flex-direction:column;gap:12px;}
    .top-row{display:flex;gap:12px;}
    .thumb{width:76px;height:76px;border-radius:16px;overflow:hidden;flex-shrink:0;background:#f3f4f6;}
    .thumb img{width:100%;height:100%;object-fit:cover;}
    .meta{flex:1;}
    .app-title{font-size:15px;margin:0 0 6px 0;font-weight:600;}
    .dev{margin:0;font-size:13px;color:var(--muted);}
    .rating{margin-top:6px;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);}
    .star{color:#f59e0b;font-weight:700;}
    .preview{border-radius:8px;overflow:hidden;}
    .preview img{width:100%;display:block;object-fit:cover;}

    footer{max-width:100%;margin:24px auto;padding:0 18px 54px;color:var(--muted);font-size:13px;}
  </style>
</head>
